name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref }}' -like 'refs/tags/v*') { '${{ github.ref_name }}'.Substring(1) } else { '1.1.0' }
          ./scripts/build.ps1 -Version $version -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Test per-user installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/*Setup*.exe | Select-Object -First 1).FullName
          ./scripts/test-installer.ps1 -SetupPath $setup -InstallPath "$env:RUNNER_TEMP\ReplayKit-install-test"
      - uses: actions/upload-artifact@v4
        with:
          name: ReplayKit-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*Setup*.exe
            artifacts/SHA256SUMS.txt
            artifacts/qa/*.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tag = if ('${{ github.ref }}' -like 'refs/tags/v*') { '${{ github.ref_name }}' } else { "v$version" }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifacts/*.zip artifacts/*Setup*.exe artifacts/SHA256SUMS.txt --title "ReplayKit $tag" --notes-file RELEASE_NOTES.md --target '${{ github.sha }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
